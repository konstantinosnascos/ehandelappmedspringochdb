<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Omsättning</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container">

    <h1>Omsättning</h1>

    <div class="card">
        <form method="get">
            <div>
                <label>Från datum</label><br>
                <input type="date" name="from" required>
            </div>

            <div>
                <label>Till datum</label><br>
                <input type="date" name="to" required>
            </div>

            <button type="submit">Visa omsättning</button>
        </form>
    </div>

    <div class="card" th:if="${revenue != null}">
        <h2>Total omsättning</h2>
        <p>
            <strong th:text="${revenue.totalRevenue}"></strong>
        </p>
    </div>

    <div class="card">
        <a href="/admin">Tillbaka till dashboard</a>
    </div>

</div>

</body>
</html>
