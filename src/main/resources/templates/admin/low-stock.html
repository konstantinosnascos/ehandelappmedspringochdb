<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lågt lager</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">

    <h1>Lågt lager</h1>

    <div class="card">
        <h2>
            Produkter med mindre än
            <span th:text="${threshold}"></span>
            i lager
        </h2>

        <table>
            <tr>
                <th>Produkt</th>
                <th>I lager</th>
            </tr>
            <tr th:each="p : ${lowStockProducts}">
                <td th:text="${p.productName}"></td>
                <td th:text="${p.inStock}"></td>
            </tr>
        </table>
    </div>

    <div class="card">
        <a href="/admin">Tillbaka till dashboard</a>
    </div>

</div>

</body>
</html>
