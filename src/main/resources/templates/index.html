<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>E‑handel</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container">

    <h1>Kunder</h1>

    <div class="card">
        <ul>
            <li th:each="c : ${customers.content}">
                <strong th:text="${c.name}"></strong>
                (<span th:text="${c.email}"></span>)
                <br>

                <a th:href="@{/customers/edit(email=${c.email})}">
                    Redigera
                </a>

                <form th:action="@{/customers/delete}" method="post" style="display:inline;">
                    <input type="hidden" name="email" th:value="${c.email}">
                    <button type="submit">Ta bort</button>
                </form>
            </li>
        </ul>

        <div class="pagination">
            <a th:if="${customers.hasPrevious()}"
               th:href="@{/(page=${customers.number - 1})}">
                Föregående
            </a>

            <span>
                Sida <span th:text="${customers.number + 1}"></span>
                av <span th:text="${customers.totalPages}"></span>
            </span>

            <a th:if="${customers.hasNext()}"
               th:href="@{/(page=${customers.number + 1})}">
                Nästa
            </a>
        </div>
    </div>

    <div class="card">
        <h2>Registrera ny kund</h2>

        <form action="/customers" method="post">
            <div>
                <label>Namn</label><br>
                <input type="text" name="name" required>
            </div>

            <div>
                <label>Email</label><br>
                <input type="email" name="email" required>
            </div>

            <button type="submit">Skapa kund</button>
        </form>
    </div>

    <div class="card">
        <h2>Välj aktiv kund</h2>

        <form action="/select-customer" method="post">
            <select name="email">
                <option th:each="c : ${customers.content}"
                        th:value="${c.email}"
                        th:text="${c.name}">
                </option>
            </select>
            <br><br>
            <button type="submit">Välj kund</button>
        </form>
    </div>

    <div class="card">
        <a href="/orders">Mina ordrar</a>
    </div>

</div>

</body>
</html>
