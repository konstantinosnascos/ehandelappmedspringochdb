<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8">
    <title>E‑handel</title>


    <link rel="stylesheet" href="/css/style.css">
</head>
    <body>

        <h1>Kunder</h1>

        <ul>
            <li th:each="c : ${customers}">
                <span th:text="${c.name}"></span>
                (<span th:text="${c.email}"></span>)

                <a th:href="@{/customers/edit(email=${c.email})}">
                    Redigera
                </a>
                <form th:action="@{/customers/delete}" method="post" style="display:inline;">
                    <input type="hidden" name="email" th:value="${c.email}">
                    <button type="submit">Ta bort</button>
                </form>
            </li>
        </ul>
        <hr>

        <h2>Registrera ny kund</h2>

        <form action="/customers" method="post">
            <div>
                <label for="name">Namn:</label><br>
                <input type="text" id="name" name="name" required>
            </div>

            <div>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required>
            </div>

            <div><p th:if="${error}" style="color:red;" th:text="${error}"></p>
                <p th:if="${success}" style="color:green;" th:text="${success}"></p>
            </div>
            <br>
            <button type="submit">Skapa kund</button>
        </form>

        <h3>Välj aktiv kund</h3>

        <form action="/select-customer" method="post">
            <select name="email">
                <option th:each="c : ${customers}"
                        th:value="${c.email}"
                        th:text="${c.name}">
                </option>
            </select>
            <button type="submit">Välj kund</button>
        </form>
        <a href="/orders">Mina ordrar</a>
        <!-- JS -->
        <script src="/js/app.js"></script>
    </body>
</html>
