<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Produkter</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<h1>Produkter</h1>

<h2>Aktiva produkter</h2>

<table border="1">
    <tr>
        <th>SKU</th>
        <th>Namn</th>
        <th>Pris</th>
        <th>Lager</th>
        <th>Åtgärd</th>
    </tr>

    <tr th:each="p : ${activeProducts}">
        <td th:text="${p.sku}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.price}"></td>
        <td th:text="${inventoryService.getStockLevel(p.id)}"></td>
        <td>
            <form th:action="@{/products/deactivate}" method="post">
                <input type="hidden" name="productId" th:value="${p.id}">
                <button type="submit">Inaktivera</button>
            </form>
            <form th:action="@{/products/add-category}" method="post">
                <input type="hidden" name="productId" th:value="${p.id}">

                <select name="categoryId">
                    <option th:each="c : ${categories}"
                            th:value="${c.id}"
                            th:text="${c.name}">
                    </option>
                </select>

                <button type="submit">Lägg till</button>
            </form>
        </td>
    </tr>
</table>

<h2>Inaktiva produkter</h2>

<table border="1">
    <tr>
        <th>SKU</th>
        <th>Namn</th>
        <th>Pris</th>
        <th>Åtgärd</th>
    </tr>

    <tr th:each="p : ${inactiveProducts}">
        <td th:text="${p.sku}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.price}"></td>
        <td>
            <form th:action="@{/products/activate}" method="post">
                <input type="hidden" name="productId" th:value="${p.id}">
                <button type="submit">Aktivera</button>
            </form>
        </td>
    </tr>
</table>

<hr>

<h2>Skapa ny produkt</h2>

<form th:action="@{/products}" method="post">
    <input name="sku" placeholder="SKU" required>
    <input name="name" placeholder="Namn" required>
    <input name="description" placeholder="Beskrivning">
    <input name="price" type="number" step="0.01" placeholder="Pris" required>
    <input name="stock" type="number" placeholder="Startlager" required>
    <button type="submit">Skapa</button>
</form>

<br>
<a href="/orders">Visa mina ordrar</a>
<a href="/">Tillbaka</a>


</body>
</html>
