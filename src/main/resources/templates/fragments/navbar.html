<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<body>

<header class="header" th:fragment="navbar">
    <nav class="container nav">

        <a href="/products" class="logo">E‑Shop</a>

        <ul class="nav-links">

            <li>
                <a href="/products">Produkter</a>
            </li>

            <li>
                <a href="/cart">Varukorg</a>
            </li>

            <li>
                <a href="/orders">Mina ordrar</a>
            </li>

            <li th:if="${activeCustomer != null and activeCustomer.hasRole('ADMIN')}">
                <a href="/admin">Admin</a>
            </li>

            <li th:if="${activeCustomer != null}">
                <span th:text="${activeCustomer.name}"></span>
            </li>

            <li class="cart-menu">
                <a href="/cart">
                    Varukorg
                    <span th:if="${cartItemCount > 0}"
                          class="cart-badge"
                          th:text="${cartItemCount}">
        </span>
                </a>

                <div class="mini-cart">
                    <p th:if="${cartItemCount == 0}">
                        Varukorgen är tom
                    </p>

                    <ul th:if="${cartItemCount > 0}">
                        <li th:each="item : ${activeCustomer != null ?
                                 @cartService.getCartWithItems(activeCustomer).items : {}}">
                            <span th:text="${item.product.name}"></span>
                            × <span th:text="${item.qty}"></span>
                        </li>
                    </ul>

                    <a href="/cart" class="btn btn-primary">
                        Till varukorg
                    </a>
                </div>
            </li>

        </ul>

    </nav>
</header>

</body>
</html>
